name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out go-mrbvm
        uses: actions/checkout@v4
        with:
          path: go-mrbvm

      # go-mrbvm's go.mod uses `replace ../go-mrbc` during development.
      # The token fallback works for a public go-mrbc repository; set
      # GO_MRBC_TOKEN when it is private.
      - name: Check out go-mrbc
        uses: actions/checkout@v4
        with:
          repository: onohiroki/go-mrbc
          path: go-mrbc
          token: ${{ secrets.GO_MRBC_TOKEN || github.token }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-mrbvm/go.mod
          cache: true
          cache-dependency-path: go-mrbvm/go.sum

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build mruby 4.0.0
        run: |
          git clone --depth 1 --branch 4.0.0 https://github.com/mruby/mruby.git mruby
          cd mruby
          rake

      - name: Add mruby to PATH
        run: echo "$GITHUB_WORKSPACE/mruby/build/host/bin" >> "$GITHUB_PATH"

      - name: Vet and test
        working-directory: go-mrbvm
        run: |
          go vet ./...
          go test ./...

      - name: Differential run over the shared corpus
        working-directory: go-mrbvm
        run: go run ./cmd/vmcompat -corpus

      - name: Official test manifest
        working-directory: go-mrbvm
        run: go run ./cmd/mrbtest -manifest testdata/official.txt
