name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Unit tests
        run: go test ./... -timeout 15m

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out go-mrbvm
        uses: actions/checkout@v7
        with:
          path: go-mrbvm

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-mrbvm/go.mod
          cache: true
          cache-dependency-path: go-mrbvm/go.sum

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # The official test manifests target the development tree used locally,
      # not the 4.0.0 release tag. Keep the test-input checkout pinned.
      - name: Fetch the mruby development test tree
        working-directory: go-mrbvm
        run: |
          git clone https://github.com/mruby/mruby.git mruby
          git -C mruby checkout dbab56510f298159ebc04f6159eb91253ba7549e

      - name: Build mruby 4.0.0 reference
        run: |
          git clone --depth 1 --branch 4.0.0 https://github.com/mruby/mruby.git mruby-4.0.0
          cd mruby-4.0.0
          rake

      - name: Add mruby 4.0.0 to PATH
        run: echo "$GITHUB_WORKSPACE/mruby-4.0.0/build/host/bin" >> "$GITHUB_PATH"

      - name: Vet and test
        working-directory: go-mrbvm
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./... -timeout 15m

      - name: Race tests
        working-directory: go-mrbvm
        run: go test -race ./... -timeout 30m

      - name: Fuzz smoke (VM runner)
        working-directory: go-mrbvm
        run: go test ./mrbvm -run '^$' -fuzz '^FuzzRun$' -fuzztime=15s

      - name: Fuzz smoke (bytecode loader)
        working-directory: go-mrbvm
        run: go test ./mrbvm -run '^$' -fuzz '^FuzzDecodeBytecode$' -fuzztime=15s

      - name: Differential run over the shared corpus
        working-directory: go-mrbvm
        run: go run ./cmd/vmcompat -strict -stderr -corpus

      - name: Random differential run
        working-directory: go-mrbvm
        run: go run ./cmd/vmcompat -strict -stderr -random 50 -seed 1

      - name: Official core test manifest
        working-directory: go-mrbvm
        run: go run ./cmd/mrbtest -manifest testdata/official.txt

      - name: Official mrbgem test manifest
        working-directory: go-mrbvm
        run: go run ./cmd/mrbtest -manifest testdata/official-gems.txt
