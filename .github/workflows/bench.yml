name: Bench

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Run benchmarks
        run: make bench
      - name: Run bundle benchmark
        run: make bundle-bench
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: |
            benchmark/latest.txt
            benchmark/bundle-latest.txt
